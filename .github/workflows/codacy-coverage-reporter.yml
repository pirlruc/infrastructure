name: Coverage Reporter

on:
  # Triggers the workflow on push or pull request events
  push:
    branches: 
    - main
    - developer
    - feature-semgrep
    
  # Runs this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  sast:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip

    - name: Semgrep Security Analysis
      run: |
        pip install semgrep
        semgrep scan --config auto . --json-output=semgrep_output.json --error

    - name: Flawfinder Security Analysis
      run: |
        pip install flawfinder
        flawfinder --context --html . > flawfinder_output.html

    - name: Cppcheck Security Analysis
      run: |
        sudo apt-get install cppcheck
        cppcheck --error-exitcode=1 --enable=warning --enable=performance --enable=portability -I include include src --xml 2> cppcheck_output.xml

    - name: Upload Security Analysis Artifacts
      uses: actions/upload-artifact@v4
      with: 
        name: Security Analysis
        path: |
          semgrep_output.json
          flawfinder_output.html
          cppcheck_output.xml

  codacy-coverage-reporter:
    env:
      VCPKG_ROOT: /usr/local/share/vcpkg
    # The type of runner that the job will run on
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
        - {
            name: codacy-coverage-reporter,
            os: ubuntu-latest,
            preset_name: "clang-coverage",
            binary_dir: "out/build/clang-coverage"
          }

    steps:
      - name: Get Branch Name
        id: branch-name
        shell: bash
        run: echo "branch=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT
        
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Print Event
        run: |
          echo github.event.action: ${{ github.event.action }}
          echo github.event_name: ${{ github.event_name }}
          echo github.branch: ${{ steps.branch-name.outputs.branch }}
          
      - name: Install Dependencies
        run: |
          sudo apt-get install ninja-build
          sudo apt-get install lcov
          ninja    --version
          cmake    --version
          gcc      --version
          gcc-11   --version
          clang    --version
          clang-14 --version
          lcov     --version
          vcpkg    --version

      - name: Restore Build Cache
        id: restore-build-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            out/*
            build/*
            external/*
            test/external/*
          key: ${{ matrix.config.os }}-build-${{ matrix.config.preset_name }}-${{ hashFiles('CMakeLists.txt','test/CMakeLists.txt') }}
          restore-keys: |
            ${{ matrix.config.os }}-build-${{ matrix.config.preset_name }}

      - name: Clean Build Folder
        if: steps.restore-build-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          rm -rf out
          rm -rf build
          mkdir build

      - name: Configure
        shell: bash
        run: |
          cmake --preset ${{ matrix.config.preset_name }}

      - name: Build
        shell: bash
        run: cmake --build --preset ${{ matrix.config.preset_name }} --target all

      - if: ${{ steps.branch-name.outputs.branch == 'developer' }}
        name: Save Build Cache
        id: save-build-cache
        uses: actions/cache/save@v4
        with:
          path: |
            out/*
            build/*
            external/*
            test/external/*
          key: ${{ matrix.config.os }}-build-${{ matrix.config.preset_name }}-${{ hashFiles('CMakeLists.txt','test/CMakeLists.txt') }}

      - name: Code Coverage Report
        shell: bash
        run: |
          HOME_DIRECTORY=$(pwd)
          cd ${{ matrix.config.binary_dir }}/bin
          ./improc-infrastructure_testd --gtest_output="xml:improc-infrastructure_tests.xml"
          cd "$HOME_DIRECTORY"
          cmake --build --preset ${{ matrix.config.preset_name }} --target improc-infrastructure_coverage

      - name: Unit Tests Report 
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          check_name: "unit-tests-report"
          time_unit: milliseconds
          files: |
            **/improc-infrastructure_tests.xml

      - name: Run codacy-coverage-reporter
        uses: codacy/codacy-coverage-reporter-action@v1
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: ./${{ matrix.config.binary_dir }}/improc-infrastructure_coverage.lcov
